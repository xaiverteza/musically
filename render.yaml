
services:
  - type: web
    name: musically
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: SESSION_SECRET
        generateValue: true

      - key: DISCORD_CLIENT_ID
        sync: false

      - key: DISCORD_CLIENT_SECRET
        sync: false

      - key: DISCORD_REDIRECT_URI
        sync: false
